<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAVUZ TAŞPINAR - Full HD Video & Müzik Birleştirici</title>
    <style>
        /* Genel Sayfa Tasarımı (Karanlık Tema) */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #080808;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
            text-shadow: 0 0 20px #ffaa00;
            letter-spacing: 2px;
            text-align: center;
            font-size: 24px;
        }

        /* Önizleme Paneli (16:9 Oranında) */
        #canvas-container {
            position: relative;
            width: 100%;
            max-width: 854px; 
            aspect-ratio: 16 / 9;
            border: 3px solid #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.15);
            background: #000000;
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Kontrol Paneli ve Butonlar */
        .controls {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            background: #121212;
            padding: 20px 30px;
            border-radius: 16px;
            border: 1px solid #222;
            width: 100%;
            max-width: 854px;
        }

        .file-upload {
            position: relative;
            display: inline-block;
        }

        .file-upload input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .btn {
            padding: 14px 28px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
            text-align: center;
        }

        .btn-video { background: #ffaa00; color: #000; }
        .btn-audio { background: #00ffff; color: #000; }
        .btn-record { background: #ff0055; color: #fff; display: none; width: 100%; max-width: 300px; }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,255,255,0.1);
        }

        .btn:disabled {
            background: #444 !important;
            color: #888 !important;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status {
            margin-top: 15px;
            font-size: 15px;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0,255,204,0.4);
            height: 24px;
            text-align: center;
            font-weight: 500;
        }

        /* TARAYICI GÜVENLİK HİLESİ */
        #hiddenVideo {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            left: -9999px;
            top: -9999px;
        }
    </style>
</head>
<body>

    <h2>YAVUZ TAŞPINAR VE MÜZİK BİRLEŞTİRİCİ - 1080P FULL HD</h2>

    <div id="canvas-container">
        <canvas id="visualizerCanvas" width="1920" height="1080"></canvas>
    </div>

    <video id="hiddenVideo" loop muted playsinline></video>

    <div class="controls">
        <div class="file-upload">
            <span class="btn btn-video">1. Videonu Seç (.mp4)</span>
            <input type="file" id="videoFile" accept="video/*">
        </div>
        <div class="file-upload">
            <span class="btn btn-audio">2. Müzik Seç (.mp3)</span>
            <input type="file" id="audioFile" accept="audio/*">
        </div>
        <button id="recordBtn" class="btn btn-record">Kaydı Başlat ve Birleştir</button>
    </div>

    <div id="status">Sistem hazır. Lütfen önce arka plan videonuzu yükleyin...</div>

    <script>
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        const videoInput = document.getElementById('videoFile');
        const audioInput = document.getElementById('audioFile');
        const recordBtn = document.getElementById('recordBtn');
        const statusText = document.getElementById('status');
        const hiddenVideo = document.getElementById('hiddenVideo');

        let audioCtx, analyser, mediaStreamDestination;
        let audioBuffer, sourceNode;
        let isPlaying = false;
        let mediaRecorder, recordedChunks = [];
        let isRecording = false;
        let bufferLength, dataArray;
        let animationFrameId; 

        let videoReady = false;
        let audioReady = false;
        let audioRawData = null;

        // 1. Video Yükleme Aşaması
        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusText.innerText = "Video işleniyor, lütfen bekleyin...";
            const fileURL = URL.createObjectURL(file);
            
            hiddenVideo.src = fileURL;
            hiddenVideo.muted = true;
            hiddenVideo.load();
            
            hiddenVideo.oncanplaythrough = function() {
                if(!videoReady) {
                    videoReady = true;
                    statusText.innerText = "Video başarıyla yüklendi! Şimdi müziğinizi seçin.";
                    checkReadyStatus();
                }
            };
        });

        // 2. Müzik Yükleme Aşaması
        audioInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusText.innerText = "Müzik dosyası okunuyor...";
            
            const reader = new FileReader();
            reader.onload = function(event) {
                audioRawData = event.target.result;
                audioReady = true;
                statusText.innerText = "Müzik hazır! Artık birleştirme işlemine başlayabilirsiniz.";
                checkReadyStatus();
            };
            reader.readAsArrayBuffer(file);
        });

        function checkReadyStatus() {
            if (videoReady && audioReady) {
                recordBtn.style.display = 'inline-block';
            }
        }

        // Ses Motorunu Hazırlama
        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                mediaStreamDestination = audioCtx.createMediaStreamDestination();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            }
            
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            return new Promise((resolve, reject) => {
                audioCtx.decodeAudioData(audioRawData.slice(0), function(buffer) {
                    audioBuffer = buffer;
                    resolve();
                }, reject);
            });
        }

        // Oynatma ve Çizim Başlangıcı
        async function startPlaying() {
            statusText.innerText = "Sistem eşleştiriliyor...";
            await initAudio();

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.connect(mediaStreamDestination);
            
            sourceNode.onended = () => {
                if(isRecording) { stopRecording(); }
            };

            sourceNode.start(0);
            hiddenVideo.currentTime = 0;
            isPlaying = true;

            try {
                await hiddenVideo.play();
            } catch(e) {
                console.error("Video oynatılamadı:", e);
            }
            
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            draw(); 
        }

        // Canlı Görselleştirici ve Video Çizim Döngüsü
        function draw() {
            if (!isPlaying) return;

            animationFrameId = requestAnimationFrame(draw);

            analyser.getByteFrequencyData(dataArray);
            let bassValue = 0;
            for(let i=0; i<10; i++) { bassValue += dataArray[i]; }
            bassValue = bassValue / 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let scale = 1 + (bassValue / 2200); 
            let newWidth = canvas.width * scale;
            let newHeight = canvas.height * scale;
            let xOffset = (canvas.width - newWidth) / 2;
            let yOffset = (canvas.height - newHeight) / 2;

            if (hiddenVideo.readyState >= 2) {
                ctx.drawImage(hiddenVideo, xOffset, yOffset, newWidth, newHeight);
            } else {
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Metin Efektleri ve Ritim Dansı
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            
            let danceRotation = Math.sin(Date.now() * 0.008) * (bassValue / 300);
            ctx.rotate(danceRotation);
            
            // Uzun isim ekranı kaplamasın diye font boyutunu biraz optimize ettim (110px)
            let dynamicFontSize = 110 + (bassValue * 0.6); 
            ctx.font = `bold ${dynamicFontSize}px 'Segoe UI', Arial, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            ctx.shadowBlur = 50 + (bassValue * 0.8);
            ctx.shadowColor = "#ffaa00"; 
            ctx.fillStyle = "#ffffff"; 
            
            // BURASI GÜNCELLENDİ: Ekranda müzikle zıplayacak isim artık senin ismin!
            ctx.fillText("YAVUZ TAŞPINAR", 0, 0);
            ctx.restore();
        }

        // Kayıt İşlemini Başlatma
        async function startRecording() {
            recordBtn.disabled = true;
            recordedChunks = [];
            
            await startPlaying();

            const canvasStream = canvas.captureStream(30); 
            const audioStream = mediaStreamDestination.stream;
            
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...audioStream.getAudioTracks()
            ]);

            let options = { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 8000000 };
            let finalExt = 'webm';
            
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm;codecs=h264,opus', videoBitsPerSecond: 8000000 };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: '', videoBitsPerSecond: 8000000 }; 
                    finalExt = 'webm';
                }
            }

            mediaRecorder = new MediaRecorder(combinedStream, options);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                statusText.innerText = "Video kodlanıyor ve paketleniyor...";
                
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                const url = URL.createObjectURL(blob);
                
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = url;
                // İnen dosya adı da senin adına göre güncellendi
                downloadAnchor.download = `yavuz_taspinar_video.${finalExt}`;
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click(); 
                document.body.removeChild(downloadAnchor);
                
                statusText.innerText = "Harika! Yeni videonuz başarıyla indirildi.";
                recordBtn.innerText = "Yeniden Birleştir";
                recordBtn.disabled = false;
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.disabled = false;
            recordBtn.style.background = "#ffcc00";
            recordBtn.style.color = "#000";
            recordBtn.innerText = "Videoyu Bitir ve İndir";
            statusText.innerText = "Şu an arka planda birleştirme ve kayıt yapılıyor...";
        }

        // Kaydı Durdurma
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if(animationFrameId) cancelAnimationFrame(animationFrameId); 
            if(sourceNode) { 
                try { sourceNode.stop(); } catch(e){} 
                isPlaying = false; 
            }
            hiddenVideo.pause();
            isRecording = false;
            recordBtn.disabled = true;
            recordBtn.style.background = "#ff0055";
            recordBtn.style.color = "#fff";
        }

        recordBtn.addEventListener('click', () => {
            if (!isRecording) { startRecording(); } else { stopRecording(); }
        });
    </script>
</body>
</html>
