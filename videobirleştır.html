<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Süper Hızlı Video & YAVUZ TAŞPINAR (Full HD Sürüm)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #050505;
            color: #fff;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        #canvas-container {
            position: relative;
            width: 854px; 
            height: 480px;
            border: 3px solid #111;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.3);
            background: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 5px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            background: #111;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .file-upload {
            position: relative;
            display: inline-block;
        }

        .file-upload input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
        }

        .btn-video { background: #ffaa00; color: #000; }
        .btn-audio { background: #00ffff; color: #000; }
        .btn-record { background: #ff0055; color: #fff; display: none; }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255,255,255,0.2);
        }

        #status {
            margin-top: 12px;
            font-size: 14px;
            color: #00ffcc;
            text-shadow: 0 0 5px rgba(0,255,204,0.5);
            height: 20px;
        }
    </style>
</head>
<body>

    <h2 style="margin-bottom: 15px; text-shadow: 0 0 15px #ffaa00; letter-spacing: 2px;">YAVUZ TAŞPINAR VE MÜZİK BİRLEŞTİRİCİ - 1080P FULL HD</h2>

    <div id="canvas-container">
        <canvas id="visualizerCanvas" width="1920" height="1080"></canvas>
    </div>

    <video id="hiddenVideo" loop muted playsinline style="display:none; width: 100%; height: 100%;"></video>

    <div class="controls">
        <div class="file-upload">
            <span class="btn btn-video">1. Videonu Seç (.mp4)</span>
            <input type="file" id="videoFile" accept="video/*">
        </div>
        <div class="file-upload">
            <span class="btn btn-audio">2. Müzik Seç (.mp3)</span>
            <input type="file" id="audioFile" accept="audio/*">
        </div>
        <button id="recordBtn" class="btn btn-record">Kaydı Başlat ve Birleştir</button>
    </div>

    <div id="status">Lütfen önce kendi çektiğin videoyu yükle...</div>

    <script>
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        const videoInput = document.getElementById('videoFile');
        const audioInput = document.getElementById('audioFile');
        const recordBtn = document.getElementById('recordBtn');
        const statusText = document.getElementById('status');
        const hiddenVideo = document.getElementById('hiddenVideo');

        let audioCtx, analyser, mediaStreamDestination;
        let audioBuffer, sourceNode;
        let isPlaying = false;
        let mediaRecorder, recordedChunks = [];
        let isRecording = false;
        let bufferLength, dataArray;
        let renderInterval; 

        let videoReady = false;
        let audioReady = false;
        let audioRawData = null; // Dosya verisini saklamak için

        videoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusText.innerText = "Video hazırlanıyor...";
            const fileURL = URL.createObjectURL(file);
            
            hiddenVideo.src = fileURL;
            hiddenVideo.muted = true;
            hiddenVideo.load();
            
            hiddenVideo.oncanplaythrough = function() {
                if(!videoReady) {
                    videoReady = true;
                    statusText.innerText = "Video hazır! Şimdi arkaya koyacağın müziği seç.";
                    checkReadyStatus();
                }
            };
        });

        audioInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            statusText.innerText = "Müzik okunuyor, lütfen bekleyin...";
            
            const reader = new FileReader();
            reader.onload = function(event) {
                audioRawData = event.target.result; // Veriyi sakla, AudioContext'i buton tıklamasında kuracağız
                audioReady = true;
                statusText.innerText = "Müzik hazır! 'Kaydı Başlat ve Birleştir' butonuna basabilirsin.";
                checkReadyStatus();
            };
            reader.readAsArrayBuffer(file);
        });

        function checkReadyStatus() {
            if (videoReady && audioReady) {
                recordBtn.style.display = 'inline-block';
            }
        }

        async function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                mediaStreamDestination = audioCtx.createMediaStreamDestination();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
            }
            
            if (audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            return new Promise((resolve, reject) => {
                // Her kayıtta müziği yeniden decode ediyoruz ki hata vermesin
                audioCtx.decodeAudioData(audioRawData.slice(0), function(buffer) {
                    audioBuffer = buffer;
                    resolve();
                }, reject);
            });
        }

        async function startPlaying() {
            statusText.innerText = "Ses motoru başlatılıyor...";
            await initAudio();

            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.connect(mediaStreamDestination);
            sourceNode.start(0);

            hiddenVideo.currentTime = 0;
            isPlaying = true;

            try {
                await hiddenVideo.play();
            } catch(e) {
                console.log("Video oynatma hatası:", e);
            }
            
            if(renderInterval) clearInterval(renderInterval);
            renderInterval = setInterval(draw, 1000 / 30);
        }

        function draw() {
            if (!isPlaying) return;

            analyser.getByteFrequencyData(dataArray);
            let bassValue = 0;
            for(let i=0; i<10; i++) { bassValue += dataArray[i]; }
            bassValue = bassValue / 10;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let scale = 1 + (bassValue / 2500); 
            let newWidth = canvas.width * scale;
            let newHeight = canvas.height * scale;
            let xOffset = (canvas.width - newWidth) / 2;
            let yOffset = (canvas.height - newHeight) / 2;

            if (hiddenVideo.readyState >= 2) {
                ctx.drawImage(hiddenVideo, xOffset, yOffset, newWidth, newHeight);
            }

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            
            let danceRotation = Math.sin(Date.now() * 0.008) * (bassValue / 350);
            ctx.rotate(danceRotation);
            
            let dynamicFontSize = 120 + (bassValue * 0.6); 
            ctx.font = `bold ${dynamicFontSize}px 'Segoe UI', Arial, sans-serif`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            ctx.shadowBlur = 40 + (bassValue * 0.7);
            ctx.shadowColor = "#ffaa00"; 
            ctx.fillStyle = "#ffffff"; 
            
            ctx.fillText("DJ BARIŞ", 0, 0);
            ctx.restore();
        }

        async function startRecording() {
            recordBtn.disabled = true; // Çift tıklamayı engelle
            recordedChunks = [];
            
            await startPlaying();

            const canvasStream = canvas.captureStream(30);
            const audioStream = mediaStreamDestination.stream;
            
            const combinedStream = new MediaStream([
                ...canvasStream.getVideoTracks(),
                ...audioStream.getAudioTracks()
            ]);

            let options = { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 8000000 };
            let finalExt = 'webm';
            
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm;codecs=h264,opus', videoBitsPerSecond: 8000000 };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: '', videoBitsPerSecond: 8000000 }; 
                }
            }

            mediaRecorder = new MediaRecorder(combinedStream, options);

            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) recordedChunks.push(e.data);
            };

            mediaRecorder.onstop = () => {
                statusText.innerText = "Video paketleniyor...";
                
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                const url = URL.createObjectURL(blob);
                
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = url;
                downloadAnchor.download = `baris_fullhd_dans_video.${finalExt}`;
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click(); 
                document.body.removeChild(downloadAnchor);
                
                statusText.innerText = "İşlem Başarılı! Video iniyor.";
                recordBtn.innerText = "Yeniden Birleştir";
                recordBtn.disabled = false;
            };

            mediaRecorder.start();
            isRecording = true;
            recordBtn.disabled = false;
            recordBtn.style.background = "#ffcc00";
            recordBtn.style.color = "#000";
            recordBtn.innerText = "Kaydı Durdur ve Videoyu Al";
            statusText.innerText = "Kayıt yapılıyor...";
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if(renderInterval) clearInterval(renderInterval); 
            if(sourceNode) { try { sourceNode.stop(); } catch(e){} isPlaying = false; }
            hiddenVideo.pause();
            isRecording = false;
            recordBtn.disabled = true;
            recordBtn.style.background = "#ff0055";
            recordBtn.style.color = "#fff";
        }

        recordBtn.addEventListener('click', () => {
            if (!isRecording) { startRecording(); } else { stopRecording(); }
        });
    </script>
</body>
</html>
